name: drive-e2e

# The hyperdrive end-to-end suite (T-19): packages/drive/tests/e2e/run.sh on
# ubuntu-latest. Unit tests still run on every PR in ci.yml;
# this job runs only when the drive package, the agent plugin, or this
# workflow changes. The unit-test job is deliberately untouched.
#
# What runs vs skips here (run.sh's documented switches):
#   HYPER_E2E_REQUIRE names every script this job expects to run, so a broken
#   runner image (no podman, no ssh, no network) FAILS instead of turning the
#   job into a green no-op.
#   sessions    SKIP — starts a REAL `claude -p` (C-18). Opt-in only via
#               HYPER_E2E_REAL_CLAUDE=1 + CLAUDE_CONFIG_DIR; the runner has no
#               claude and this job uses no secrets.
#   sync        RUNS — mutagen 0.18.1 + agent bundle; its beta is a podman
#               container with a throwaway key (the warp image). No loopback
#               sshd and no ssh key of the runner's own are involved.
#   tools       RUNS — downloads into a throwaway HOME.
#   warp        RUNS — podman is preinstalled on ubuntu-latest.

on:
  push:
    branches: [main]
    paths:
      - "packages/drive/**"
      - "agent-plugin/**"
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/gen/**"
      - "packages/kit/**"
      - "packages/hq/**"
      - "packages/ui/**"
      - "packages/create-hyper-hq/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/drive-e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/drive/**"
      - "agent-plugin/**"
      - "packages/cli/**"
      - "packages/core/**"
      - "packages/gen/**"
      - "packages/kit/**"
      - "packages/hq/**"
      - "packages/ui/**"
      - "packages/create-hyper-hq/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/drive-e2e.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup Bun
        # oven-sh/setup-bun v2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          # Pinned to the repo's .prototools; `latest` would float.
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The e2e scripts drive the built CLI, and the oclif host resolves every
      # plugin's dist/ at startup, so all packages must build first.
      - name: Build packages
        run: |
          set -euo pipefail
          for pkg in ui core create-hyper-hq kit hq drive gen cli; do
            echo "::group::build $pkg"
            (cd "packages/$pkg" && bun run build)
            echo "::endgroup::"
          done

      - name: Expose hyper CLI on PATH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/packages/cli/bin/run.js" "$HOME/.local/bin/hyper"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/hyper" --version

      # mutagen 0.18.1 is the version sync.sh was written against. The upstream
      # release publishes no checksums file, so the tarball hash is pinned here
      # (recorded from the v0.18.1 asset; bump both together).
      - name: Install mutagen
        run: |
          set -euo pipefail
          version="0.18.1"
          sha256="7735286c778cc438418209f24d03a64f3a0151c8065ef0fe079cfaf093af6f8f"
          tarball="mutagen_linux_amd64_v${version}.tar.gz"
          url="https://github.com/mutagen-io/mutagen/releases/download"
          curl -fsSL -o "/tmp/$tarball" "$url/v${version}/$tarball"
          echo "$sha256  /tmp/$tarball" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          # The mutagen binary needs its matching agent bundle for ssh beta.
          tar -xzf "/tmp/$tarball" -C "$HOME/.local/bin" \
            mutagen mutagen-agents.tar.gz
          mutagen version

      # warp.sh and sync.sh build their container fixture from this base image.
      # Pre-pull under the runner's normal HOME; run.sh preserves podman's
      # XDG storage path while each script receives its own temp HOME.
      - name: Pre-pull the podman fixture image
        run: podman pull debian:13

      - name: Run the e2e suite
        env:
          # Every script this job expects to run. A probe-skip of any of these
          # is a FAIL, not a skip, so this job cannot go green without them.
          HYPER_E2E_REQUIRE: "sync tools warp"
          # sessions: real `claude -p`, opt-in only. The skip is printed with a reason.
          HYPER_E2E_SKIP: "sessions"
        run: bash packages/drive/tests/e2e/run.sh

      - name: Show leftover containers (must be none)
        if: always()
        run: podman ps -a
