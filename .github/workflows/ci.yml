name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build packages
        run: bunx moon run :build

      # gen's e2e recipe tests shell out to a bare `hyper` CLI, which is not on
      # PATH on the runner. Expose the workspace CLI so those steps can run.
      - name: Expose hyper CLI on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/packages/cli/bin/run.js" "$HOME/.local/bin/hyper"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/hyper" --version

      - name: Type check
        run: bunx moon run :check

      - name: Lint
        run: bunx moon run :ci

      - name: Test
        run: bunx moon run :test

      - name: Verify CLI works
        run: cd packages/cli && ./bin/run.js --version
