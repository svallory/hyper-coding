# Fixture for tests/config.test.ts — loaded via HYPER_DRIVE_CONFIG.
remote = "git@github.com:example/hyperdrive.git"

[self]
name = "test-machine"
home = "/home/tester"

[defaults]
cadence = "session-end"

[machines.netcup]
home = "/home/svallory"
features = ["docker", "mutagen"]

# Only `home` set — features must come back as per-machine defaults.
[machines.spare]
home = "/home/spare"

# Leading ~/ must expand against os.homedir().
[machines.laptop]
home = "~/alice"
features = []

[warp]
exclude = ["node_modules", "dist"]

[sync.claude]
ignore = ["projects/**/*.log"]

[sync.pi]
ignore = ["sessions/**"]
