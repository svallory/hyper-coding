$schema: 'https://moonrepo.dev/schemas/project.json'
type: application
language: typescript
platform: node
stack: frontend

toolchain:
  typescript:
    syncProjectReferences: false

tasks:
  # The shared check runs tsc, which cannot read .marko files. .marko-run/routes.d.ts is
  # generated by a build, so the build comes first.
  check:
    command: 'mtc'
    args: []
    deps:
      - '~:build'
    options:
      mergeArgs: replace
